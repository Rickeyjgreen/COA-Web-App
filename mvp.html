<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COA Case Record Reviewer (MVP)</title>
    
    <!-- Tailwind CSS for rapid professional styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Custom scrollbar for better density */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .pdf-pattern {
            background-color: #e2e8f0;
            background-image: radial-gradient(#94a3b8 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="bg-slate-50 h-screen overflow-hidden">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // ==========================================
        // 1. CONFIGURATION & DATA (Edit this section)
        // ==========================================
        
        const APP_CONFIG = {
            title: "COA Record Review",
            version: "0.5.0 MVP",
            storageKey: "coa_audit_data_v1"
        };

        const CASES_DATA = [
            {
                id: "C-1024",
                client: "Rivera, Marcus",
                program: "Foster Care",
                worker: "S. Johnson",
                docUrl: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf" 
            },
            {
                id: "C-1025",
                client: "Doe, Jane",
                program: "Adoption",
                worker: "M. Thompson",
                docUrl: "" // Empty URL will show placeholder
            },
            {
                id: "C-1026",
                client: "Smith, John",
                program: "Behavioral Health",
                worker: "L. Davis",
                docUrl: "" 
            }
        ];

        const AUDIT_FORM_SCHEMA = [
            {
                section: "Intake & Assessment",
                questions: [
                    { id: "q1", label: "Is the initial intake assessment signed and dated within 24 hours?", critical: true },
                    { id: "q2", label: "Does the file contain a copy of the client's birth certificate?", critical: false }
                ]
            },
            {
                section: "Safety & Planning",
                questions: [
                    { id: "q3", label: "Is there an active Safety Plan updated in the last 90 days?", critical: true },
                    { id: "q4", label: "Are risk factors clearly identified in the most recent case note?", critical: false }
                ]
            },
            {
                section: "Medical & Educational",
                questions: [
                    { id: "q5", label: "Are immunization records current?", critical: false },
                    { id: "q6", label: "Is the most recent school report card attached?", critical: false }
                ]
            }
        ];

        // ==========================================
        // 2. COMPONENTS
        // ==========================================

        const SidebarItem = ({ data, active, onClick, status }) => {
            let statusColor = "bg-slate-300";
            if (status === "complete") statusColor = "bg-green-500";
            if (status === "started") statusColor = "bg-yellow-500";

            return (
                <div 
                    onClick={onClick}
                    className={`p-3 border-b border-slate-200 cursor-pointer hover:bg-white transition-colors group ${active ? 'bg-white border-l-4 border-l-blue-600 shadow-sm' : 'border-l-4 border-l-transparent'}`}
                >
                    <div className="flex justify-between items-start mb-1">
                        <span className={`font-mono text-xs font-bold px-1.5 py-0.5 rounded ${active ? 'bg-blue-100 text-blue-700' : 'bg-slate-200 text-slate-600'}`}>
                            {data.id}
                        </span>
                        <div className={`w-2 h-2 rounded-full ${statusColor}`} title={status} />
                    </div>
                    <div className="font-semibold text-slate-800 text-sm">{data.client}</div>
                    <div className="text-xs text-slate-500 mt-1 flex justify-between">
                        <span>{data.program}</span>
                        <span>{data.worker}</span>
                    </div>
                </div>
            );
        };

        const StatusBadge = ({ status }) => {
            const styles = {
                'compliant': 'bg-green-100 text-green-700 border-green-200',
                'non-compliant': 'bg-red-100 text-red-700 border-red-200',
                'na': 'bg-slate-100 text-slate-600 border-slate-200',
                'empty': 'bg-white text-slate-400 border-slate-200 border-dashed'
            };
            const labels = {
                'compliant': 'MET',
                'non-compliant': 'NOT MET',
                'na': 'N/A',
                'empty': 'PENDING'
            };
            return (
                <span className={`text-[10px] font-bold px-2 py-0.5 rounded border ${styles[status] || styles.empty}`}>
                    {labels[status] || labels.empty}
                </span>
            );
        };

        // ==========================================
        // 3. MAIN APP LOGIC
        // ==========================================

        const App = () => {
            const [selectedCaseIdx, setSelectedCaseIdx] = useState(0);
            const [reviews, setReviews] = useState({});
            const [sidebarOpen, setSidebarOpen] = useState(true);
            const [toast, setToast] = useState(null);

            // Load data on mount
            useEffect(() => {
                const saved = localStorage.getItem(APP_CONFIG.storageKey);
                if (saved) {
                    try {
                        setReviews(JSON.parse(saved));
                    } catch (e) {
                        console.error("Failed to load saved data");
                    }
                }
            }, []);

            // Save data on change
            useEffect(() => {
                if (Object.keys(reviews).length > 0) {
                    localStorage.setItem(APP_CONFIG.storageKey, JSON.stringify(reviews));
                }
            }, [reviews]);

            const activeCase = CASES_DATA[selectedCaseIdx];
            const activeReview = reviews[activeCase.id] || {};

            const updateReview = (field, value) => {
                setReviews(prev => ({
                    ...prev,
                    [activeCase.id]: {
                        ...prev[activeCase.id],
                        [field]: value,
                        lastModified: new Date().toISOString()
                    }
                }));
            };

            const getCaseStatus = (caseId) => {
                const r = reviews[caseId];
                if (!r) return "pending";
                
                // Check if all questions have an answer
                let totalQ = 0;
                let answeredQ = 0;
                AUDIT_FORM_SCHEMA.forEach(section => {
                    section.questions.forEach(q => {
                        totalQ++;
                        if (r[q.id]) answeredQ++;
                    });
                });

                if (answeredQ === 0) return "pending";
                if (answeredQ === totalQ) return "complete";
                return "started";
            };

            const handleExport = () => {
                const dataStr = JSON.stringify(reviews, null, 2);
                const blob = new Blob([dataStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.download = `COA_Audit_Export_${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                showToast("Data exported successfully!");
            };

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 3000);
            };

            // Icons
            const Icons = {
                Menu: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" /></svg>,
                Download: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>,
                Check: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" /></svg>,
                X: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" /></svg>
            };

            return (
                <div className="flex h-screen flex-col md:flex-row text-slate-800 font-sans">
                    
                    {/* TOAST NOTIFICATION */}
                    {toast && (
                        <div className="fixed top-4 right-4 bg-slate-800 text-white px-4 py-2 rounded shadow-lg z-50 text-sm animate-fade-in">
                            {toast}
                        </div>
                    )}

                    {/* SIDEBAR */}
                    <div className={`${sidebarOpen ? 'w-full md:w-80' : 'w-0'} bg-slate-50 border-r border-slate-200 flex flex-col transition-all duration-300 overflow-hidden shrink-0`}>
                        <div className="p-4 bg-white border-b border-slate-200 flex justify-between items-center shadow-sm z-10">
                            <h1 className="font-bold text-slate-700 tracking-tight">{APP_CONFIG.title}</h1>
                            <span className="text-[10px] bg-slate-100 px-2 py-1 rounded text-slate-500">{APP_CONFIG.version}</span>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto">
                            {CASES_DATA.map((c, idx) => (
                                <SidebarItem 
                                    key={c.id} 
                                    data={c} 
                                    active={idx === selectedCaseIdx} 
                                    status={getCaseStatus(c.id)}
                                    onClick={() => setSelectedCaseIdx(idx)} 
                                />
                            ))}
                        </div>

                        <div className="p-4 border-t border-slate-200 bg-white">
                            <button 
                                onClick={handleExport}
                                className="w-full flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 text-white py-2 rounded text-sm font-medium transition-colors"
                            >
                                <Icons.Download /> Export Results
                            </button>
                        </div>
                    </div>

                    {/* MAIN CONTENT AREA */}
                    <div className="flex-1 flex flex-col h-full overflow-hidden relative bg-white">
                        
                        {/* MOBILE/COLLAPSE HEADER */}
                        <div className="h-12 border-b border-slate-200 flex items-center px-4 justify-between bg-white shrink-0">
                            <div className="flex items-center gap-3">
                                <button onClick={() => setSidebarOpen(!sidebarOpen)} className="p-1 hover:bg-slate-100 rounded text-slate-500">
                                    <Icons.Menu />
                                </button>
                                <span className="font-semibold text-sm text-slate-700">{activeCase.client} <span className="text-slate-400 font-normal">| {activeCase.id}</span></span>
                            </div>
                            <div className="text-xs text-slate-400">
                                Auto-saved
                            </div>
                        </div>

                        {/* SPLIT VIEW */}
                        <div className="flex-1 flex flex-col md:flex-row overflow-hidden">
                            
                            {/* DOCUMENT VIEWER (LEFT) */}
                            <div className="flex-1 bg-slate-100 flex flex-col border-r border-slate-200 min-h-[300px] md:min-h-0 relative group">
                                <div className="absolute top-2 right-2 z-10 bg-white/90 backdrop-blur px-2 py-1 rounded text-[10px] font-bold text-slate-500 shadow-sm">
                                    SOURCE RECORD
                                </div>
                                <div className="flex-1 pdf-pattern p-4 md:p-8 flex items-center justify-center overflow-hidden">
                                    {activeCase.docUrl ? (
                                        <iframe src={activeCase.docUrl} className="w-full h-full shadow-lg rounded bg-white" title="Document"></iframe>
                                    ) : (
                                        <div className="text-center text-slate-400 p-8">
                                            <div className="text-4xl mb-2">📄</div>
                                            <p className="text-sm">No digital record linked.</p>
                                            <button className="mt-4 text-xs text-blue-600 underline hover:text-blue-800">Upload Manually</button>
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* AUDIT FORM (RIGHT) */}
                            <div className="w-full md:w-[450px] flex flex-col bg-white shadow-xl z-20">
                                <div className="flex-1 overflow-y-auto p-6 space-y-8">
                                    
                                    {AUDIT_FORM_SCHEMA.map((section, sIdx) => (
                                        <div key={sIdx} className="space-y-4">
                                            <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider border-b border-slate-100 pb-2">
                                                {section.section}
                                            </h3>
                                            
                                            {section.questions.map((q) => {
                                                const val = activeReview[q.id];
                                                return (
                                                    <div key={q.id} className="group">
                                                        <div className="flex justify-between items-start mb-2">
                                                            <p className="text-sm text-slate-700 font-medium pr-4 leading-snug">
                                                                {q.label}
                                                                {q.critical && <span className="text-red-500 ml-1" title="Critical Standard">*</span>}
                                                            </p>
                                                            <StatusBadge status={val || 'empty'} />
                                                        </div>
                                                        
                                                        <div className="grid grid-cols-3 gap-2 mt-2">
                                                            <button 
                                                                onClick={() => updateReview(q.id, 'compliant')}
                                                                className={`py-2 px-1 text-xs font-bold rounded flex items-center justify-center gap-1 transition-all ${val === 'compliant' ? 'bg-green-600 text-white shadow-md transform scale-[1.02]' : 'bg-slate-50 text-slate-500 hover:bg-green-50 hover:text-green-600 border border-slate-100'}`}
                                                            >
                                                                <Icons.Check /> MET
                                                            </button>
                                                            <button 
                                                                onClick={() => updateReview(q.id, 'non-compliant')}
                                                                className={`py-2 px-1 text-xs font-bold rounded flex items-center justify-center gap-1 transition-all ${val === 'non-compliant' ? 'bg-red-500 text-white shadow-md transform scale-[1.02]' : 'bg-slate-50 text-slate-500 hover:bg-red-50 hover:text-red-600 border border-slate-100'}`}
                                                            >
                                                                <Icons.X /> NOT MET
                                                            </button>
                                                            <button 
                                                                onClick={() => updateReview(q.id, 'na')}
                                                                className={`py-2 px-1 text-xs font-bold rounded transition-all ${val === 'na' ? 'bg-slate-600 text-white shadow-md' : 'bg-slate-50 text-slate-500 hover:bg-slate-200 border border-slate-100'}`}
                                                            >
                                                                N/A
                                                            </button>
                                                        </div>

                                                        {val === 'non-compliant' && (
                                                            <textarea 
                                                                className="w-full mt-2 p-2 text-xs border border-red-200 bg-red-50 rounded focus:outline-none focus:border-red-400 text-red-800 placeholder-red-300"
                                                                placeholder="Explain non-compliance (Required)..."
                                                                rows="2"
                                                                value={activeReview[`${q.id}_comment`] || ''}
                                                                onChange={(e) => updateReview(`${q.id}_comment`, e.target.value)}
                                                            />
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    ))}

                                    <div className="pt-6 border-t border-slate-100">
                                        <label className="block text-xs font-bold text-slate-500 mb-2">GENERAL NOTES</label>
                                        <textarea 
                                            className="w-full p-3 text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition-shadow"
                                            rows="4"
                                            placeholder="Enter summary of findings..."
                                            value={activeReview.generalNotes || ''}
                                            onChange={(e) => updateReview('generalNotes', e.target.value)}
                                        ></textarea>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
